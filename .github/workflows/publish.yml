name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: node test/run.js
      - run: node test/e2e.js
      - name: Verify deep bundle inputs
        run: |
          test -n "$CSZONE38_DEEP_BUNDLE_LINUX_X64" || { echo "publish: missing repo var CSZONE38_DEEP_BUNDLE_LINUX_X64"; exit 1; }
          test -n "$CSZONE38_DEEP_BUNDLE_DARWIN_X64" || { echo "publish: missing repo var CSZONE38_DEEP_BUNDLE_DARWIN_X64"; exit 1; }
          test -n "$CSZONE38_DEEP_BUNDLE_WIN32_X64" || { echo "publish: missing repo var CSZONE38_DEEP_BUNDLE_WIN32_X64"; exit 1; }
          test -d "$CSZONE38_DEEP_BUNDLE_LINUX_X64" || { echo "publish: linux-x64 bundle path is not a directory on the release runner"; exit 1; }
          test -d "$CSZONE38_DEEP_BUNDLE_DARWIN_X64" || { echo "publish: darwin-x64 bundle path is not a directory on the release runner"; exit 1; }
          test -d "$CSZONE38_DEEP_BUNDLE_WIN32_X64" || { echo "publish: win32-x64 bundle path is not a directory on the release runner"; exit 1; }
      - name: Stage publishable packages
        run: |
          npm run prepare:deep-release -- \
            --output-dir=./.release \
            --bundle-linux-x64="$CSZONE38_DEEP_BUNDLE_LINUX_X64" \
            --bundle-darwin-x64="$CSZONE38_DEEP_BUNDLE_DARWIN_X64" \
            --bundle-win32-x64="$CSZONE38_DEEP_BUNDLE_WIN32_X64"
      - name: Publish staged packages
        run: |
          node <<'NODE'
          var childProcess = require('child_process');
          var fs = require('fs');
          var path = require('path');

          var manifest = JSON.parse(fs.readFileSync(path.resolve('.release', 'release-manifest.json'), 'utf8'));

          for (var i = 0; i < manifest.publishOrder.length; i++) {
            var packageDir = path.resolve('.release', 'packages', manifest.publishOrder[i]);
            childProcess.execFileSync('npm', ['publish', packageDir], { stdio: 'inherit' });
          }
          NODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
