name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: node test/run.js
      - run: node test/e2e.js
      - name: Verify deep bundle inputs
        run: |
          test -n "$CSZONE38_DEEP_BUNDLE_LINUX_X64" || { echo "publish: missing repo var CSZONE38_DEEP_BUNDLE_LINUX_X64"; exit 1; }
          test -d "$CSZONE38_DEEP_BUNDLE_LINUX_X64" || { echo "publish: linux-x64 bundle path is not a directory on the release runner"; exit 1; }
      - name: Pack Linux deep bundle asset
        run: |
          rm -rf ./.release-assets
          mkdir -p ./.release-assets/cszone38-deep-linux-x64
          cp -R "$CSZONE38_DEEP_BUNDLE_LINUX_X64"/. ./.release-assets/cszone38-deep-linux-x64/
          tar -C ./.release-assets -czf ./.release-assets/cszone38-deep-linux-x64.tar.gz cszone38-deep-linux-x64
      - name: Publish npm package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload Linux deep bundle asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./.release-assets/cszone38-deep-linux-x64.tar.gz
