<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" width="800" height="320">
  <defs>
    <!-- Light background -->
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8fafc"/>
    </linearGradient>

    <!-- C# purple-to-blue gradient (deeper for light bg) -->
    <linearGradient id="csharpGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accentGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0"/>
    </linearGradient>

    <!-- Text gradient (dark on light) -->
    <linearGradient id="textGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>

    <!-- Number gradient -->
    <linearGradient id="numGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>

    <!-- Subtle glow for light mode -->
    <filter id="glowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern for light mode -->
    <pattern id="gridL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.3" opacity="0.06"/>
    </pattern>

    <clipPath id="roundClipL">
      <rect width="800" height="320" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="16" fill="url(#bgGradL)"/>
  <rect width="800" height="320" rx="16" fill="url(#gridL)" clip-path="url(#roundClipL)"/>

  <!-- Outer border -->
  <rect x="1" y="1" width="798" height="318" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="320" rx="2" fill="url(#csharpGradL)"/>

  <!-- Subtle bottom rule -->
  <rect x="80" y="306" width="640" height="1.5" rx="1" fill="url(#accentGradL)" opacity="0.4"/>

  <!-- ═══ C# SYMBOL BLOCK ═══ -->
  <!-- Icon container with light styling -->
  <rect x="44" y="44" width="200" height="200" rx="24" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Inner subtle gradient overlay -->
  <rect x="44" y="44" width="200" height="200" rx="24" fill="url(#csharpGradL)" opacity="0.04"/>

  <!-- C letter arc -->
  <path d="M 165 88 
           A 62 62 0 1 0 165 200" 
        fill="none" 
        stroke="url(#csharpGradL)" 
        stroke-width="22" 
        stroke-linecap="round"
        filter="url(#glowL)"/>

  <!-- Hash # symbol bars -->
  <line x1="174" y1="124" x2="216" y2="124" stroke="url(#csharpGradL)" stroke-width="10" stroke-linecap="round"/>
  <line x1="174" y1="152" x2="216" y2="152" stroke="url(#csharpGradL)" stroke-width="10" stroke-linecap="round"/>
  <line x1="184" y1="112" x2="181" y2="166" stroke="url(#csharpGradL)" stroke-width="8" stroke-linecap="round"/>
  <line x1="205" y1="112" x2="202" y2="166" stroke="url(#csharpGradL)" stroke-width="8" stroke-linecap="round"/>

  <!-- IC hint -->
  <circle cx="144" cy="244" r="3" fill="#4f46e5" opacity="0.7"/>
  <text x="154" y="248" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" letter-spacing="0.5">IC=0.038</text>

  <!-- ═══ WORDMARK ═══ -->
  <text x="280" y="148" 
        font-family="'Courier New', 'Consolas', monospace" 
        font-size="72" 
        font-weight="700"
        letter-spacing="-2"
        fill="url(#textGradL)">cs</text>

  <text x="378" y="148" 
        font-family="'Courier New', 'Consolas', monospace" 
        font-size="72" 
        font-weight="700"
        letter-spacing="-2"
        fill="url(#numGradL)">zone</text>

  <text x="610" y="148" 
        font-family="'Courier New', 'Consolas', monospace" 
        font-size="72" 
        font-weight="700"
        fill="url(#csharpGradL)"
        filter="url(#glowL)">38</text>

  <!-- Divider -->
  <line x1="280" y1="162" x2="726" y2="162" stroke="url(#accentGradL)" stroke-width="1" opacity="0.4"/>

  <!-- Tagline -->
  <text x="280" y="188" 
        font-family="'Courier New', 'Consolas', monospace" 
        font-size="14" 
        fill="#94a3b8"
        letter-spacing="3">STATIC ANALYSIS FOR C# CODEBASES</text>

  <!-- Axis badges — light mode versions -->
  <rect x="280" y="212" width="52" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="306" y="227" font-family="'Courier New', monospace" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="bold">A·SLOP</text>

  <rect x="340" y="212" width="68" height="22" rx="4" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="374" y="227" font-family="'Courier New', monospace" font-size="11" fill="#4338ca" text-anchor="middle" font-weight="bold">B·SECURITY</text>

  <rect x="416" y="212" width="72" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="452" y="227" font-family="'Courier New', monospace" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">C·QUALITY</text>

  <!-- Offline badge -->
  <rect x="638" y="212" width="88" height="22" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="682" y="227" font-family="'Courier New', monospace" font-size="10" fill="#16a34a" text-anchor="middle">● OFFLINE</text>

  <!-- Version -->
  <text x="744" y="314" font-family="'Courier New', monospace" font-size="9" fill="#cbd5e1" text-anchor="end">v0.1.0</text>
</svg>
